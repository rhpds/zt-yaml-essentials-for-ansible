---
# HEALTHCHECK — Quick environment readiness check
# Runs post-provisioning to verify the lab environment is functional.
# Should complete in under 60 seconds.
#
# Exit 0 = healthy, non-zero = unhealthy.

- name: "YAML Essentials Lab Health Check"
  hosts: host1
  gather_facts: false
  tasks:
    - name: Check if yamllint is installed
      ansible.builtin.command: which yamllint
      register: yamllint_check
      failed_when: false
      changed_when: false

    - name: Check if code-server is installed
      ansible.builtin.command: which code-server
      register: codeserver_check
      failed_when: false
      changed_when: false

    - name: Check if port 8080 is listening (code-server)
      ansible.builtin.wait_for:
        port: 8080
        host: 0.0.0.0
        timeout: 5
      register: port_8080
      failed_when: false

    - name: Check if practice files exist
      ansible.builtin.stat:
        path: "/home/rhel/{{ item }}"
      register: practice_files
      loop:
        - syntax-practice.yml
        - data-types-practice.yml
        - practice.yaml
        - broken.yml
        - apache-playbook.yml

    - name: Fail if setup has not completed
      ansible.builtin.fail:
        msg: |
          Lab setup incomplete. Missing components:
          {% if yamllint_check.rc != 0 %}- yamllint not installed{% endif %}
          {% if codeserver_check.rc != 0 %}- code-server not installed{% endif %}
          {% if port_8080 is failed %}- code-server not listening on port 8080{% endif %}
      when: >
        yamllint_check.rc != 0 or
        codeserver_check.rc != 0 or
        port_8080 is failed

    - name: Display success message
      ansible.builtin.debug:
        msg: "✓ All health checks passed - lab environment is ready"
