---
- name: Set up YAML Essentials for Ansible lab environment
  hosts: localhost
  gather_facts: true
  vars:
    workspace_dir: "{{ lookup('env', 'HOME') | default('/workspace', true) }}"

  tasks:
    - name: Ensure workspace directory exists
      ansible.builtin.file:
        path: "{{ workspace_dir }}"
        state: directory
        mode: '0755'

    - name: Install yamllint
      ansible.builtin.package:
        name: yamllint
        state: present
      become: true
      ignore_errors: true

    - name: Install ansible-navigator (if not already present)
      ansible.builtin.package:
        name: ansible-navigator
        state: present
      become: true
      ignore_errors: true

    - name: Create yamllint config with beginner-friendly rules
      ansible.builtin.copy:
        dest: "{{ workspace_dir }}/.yamllint"
        content: |
          extends: default
          rules:
            line-length:
              max: 120
            indentation:
              spaces: 2
            document-start: require
        mode: '0644'

    - name: Create syntax-practice.yml stub (Module 02)
      ansible.builtin.copy:
        dest: "{{ workspace_dir }}/syntax-practice.yml"
        content: |
          ---

        mode: '0644'

    - name: Create data-types-practice.yml stub (Module 03)
      ansible.builtin.copy:
        dest: "{{ workspace_dir }}/data-types-practice.yml"
        content: |
          ---

        mode: '0644'

    - name: Create practice.yaml stub (Module 04)
      ansible.builtin.copy:
        dest: "{{ workspace_dir }}/practice.yaml"
        content: |
          ---

        mode: '0644'

    - name: Create broken.yml with intentional errors (Module 05)
      ansible.builtin.copy:
        dest: "{{ workspace_dir }}/broken.yml"
        content: |
          name:value
          description: "This file has multiple YAML syntax errors for practice"
          	indented_with_tab: true
          items:
              - first
            - second
          trailing_spaces: "check this line"
          missing_doc_start: true
          this_line_is_intentionally_way_too_long_to_exceed_the_recommended_line_length_limit_of_120_characters_which_should_trigger_a_yamllint_warning
        mode: '0644'

    - name: Create apache-playbook.yml (Module 06)
      ansible.builtin.copy:
        dest: "{{ workspace_dir }}/apache-playbook.yml"
        content: |
          ---
          - name: Install and configure Apache web server
            hosts: localhost
            become: true
            tasks:
              - name: Install Apache package
                ansible.builtin.package:
                  name: httpd
                  state: present

              - name: Start Apache service
                ansible.builtin.service:
                  name: httpd
                  state: started
                  enabled: true

              - name: Allow HTTP traffic through firewall
                ansible.posix.firewalld:
                  service: http
                  permanent: true
                  state: enabled
                  immediate: true
                when: ansible_os_family == "RedHat"
        mode: '0644'

    - name: Create simple Ansible inventory for localhost
      ansible.builtin.copy:
        dest: "{{ workspace_dir }}/inventory"
        content: |
          [local]
          localhost ansible_connection=local
        mode: '0644'

    - name: Display setup completion message
      ansible.builtin.debug:
        msg: |
          YAML Essentials lab environment ready!
          - yamllint installed and configured
          - Practice YAML files created in {{ workspace_dir }}
          - Ready to start Module 01
