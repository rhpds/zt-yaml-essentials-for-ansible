---
# Module 2 Solve - Adds tasks section with first task if missing

- name: Module 2 Solve
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  become_user: rhel
  tasks:
    - name: Check if tasks section exists
      ansible.builtin.shell: grep -q "tasks:" /home/rhel/yaml-practice/webserver.yml
      register: tasks_check
      failed_when: false
      changed_when: false

    - name: Add tasks section with first task
      ansible.builtin.copy:
        dest: /home/rhel/yaml-practice/webserver.yml
        owner: rhel
        group: rhel
        mode: '0644'
        content: |
          ---
          - name: Configure web server
            hosts: localhost
            become: true

            tasks:
              - name: Install web server package
                ansible.builtin.package:
                  name: httpd
      when: tasks_check.rc != 0

    - name: Report success
      ansible.builtin.debug:
        msg: "✓ Tasks section exists - Module 2 complete!"
