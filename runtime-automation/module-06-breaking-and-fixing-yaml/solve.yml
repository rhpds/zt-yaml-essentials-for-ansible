---
# Module 6 Solve - Fixes all four broken YAML files

- name: Module 6 Solve
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  become_user: rhel
  tasks:
    - name: Fix webserver-broken-A.yml (indentation error)
      ansible.builtin.copy:
        dest: /home/rhel/yaml-practice/webserver-broken-A.yml
        owner: rhel
        group: rhel
        mode: '0644'
        content: |
          ---
          - name: Configure web server
            hosts: localhost

            tasks:
              - name: Install web server package  # Fixed indentation
                ansible.builtin.package:
                  name: httpd

    - name: Fix webserver-broken-B.yml (missing quotes)
      ansible.builtin.copy:
        dest: /home/rhel/yaml-practice/webserver-broken-B.yml
        owner: rhel
        group: rhel
        mode: '0644'
        content: |
          ---
          - name: Configure web server
            hosts: localhost

            tasks:
              - name: Create custom home page
                ansible.builtin.copy:
                  dest: /var/www/html/index.html
                  content: "Welcome!"
                  mode: '0644'  # Fixed - added quotes

    - name: Fix webserver-broken-C.yml (missing list dash)
      ansible.builtin.copy:
        dest: /home/rhel/yaml-practice/webserver-broken-C.yml
        owner: rhel
        group: rhel
        mode: '0644'
        content: |
          ---
          - name: Configure web server
            hosts: localhost

            tasks:
              - name: Install web server package
                ansible.builtin.package:
                  name: httpd

              - name: Start web server  # Fixed - added dash
                ansible.builtin.service:
                  name: httpd
                  state: started

    - name: Fix webserver-broken-D.yml (tab character)
      ansible.builtin.copy:
        dest: /home/rhel/yaml-practice/webserver-broken-D.yml
        owner: rhel
        group: rhel
        mode: '0644'
        content: |
          ---
          - name: Configure web server
            hosts: localhost

            tasks:
              - name: Install web server  # Fixed - spaces instead of tab
                ansible.builtin.package:
                  name: httpd

    - name: Report success
      ansible.builtin.debug:
        msg: "✓ Fixed all 4 broken YAML files - Module 6 complete!"
