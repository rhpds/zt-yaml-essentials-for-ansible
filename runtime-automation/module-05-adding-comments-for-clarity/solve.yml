---
# Module 5 Solve - Adds comments to playbook

- name: Module 5 Solve
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  become_user: rhel
  tasks:
    - name: Check if comments exist
      ansible.builtin.shell: grep -q "# Package installation" /home/rhel/yaml-practice/webserver.yml
      register: comments_check
      failed_when: false
      changed_when: false

    - name: Add comments to playbook
      ansible.builtin.copy:
        dest: /home/rhel/yaml-practice/webserver.yml
        owner: rhel
        group: rhel
        mode: '0644'
        content: |
          # This playbook configures a basic Apache web server on localhost
          # Tested on RHEL 9

          ---
          - name: Configure web server
            hosts: localhost
            become: true

            tasks:
              # Package installation
              - name: Install web server package
                ansible.builtin.package:
                  name: httpd

              # Service management
              - name: Start web server
                ansible.builtin.service:
                  name: httpd
                  state: started

              - name: Enable web server on boot
                ansible.builtin.service:
                  name: httpd
                  enabled: yes

              # Content deployment
              - name: Create custom home page
                ansible.builtin.copy:
                  dest: /var/www/html/index.html
                  content: "Welcome to my web server!"
                  owner: apache
                  mode: '0644'  # Quoted to prevent YAML from interpreting as octal
      when: comments_check.rc != 0

    - name: Report success
      ansible.builtin.debug:
        msg: "✓ Comments added - Module 5 complete!"
