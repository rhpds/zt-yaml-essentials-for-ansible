---
# VALIDATE — Module 5
# Checks that comments have been added to webserver.yml

- name: "Module 5 Validation"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read webserver.yml
      ansible.builtin.slurp:
        path: /home/rhel/yaml-practice/webserver.yml
      register: playbook_content

    - name: Check for YAML comments
      ansible.builtin.set_fact:
        has_comments: "{{ (playbook_content.content | b64decode) is search('#') }}"

    - name: Validate comments exist
      validation_check:
        check: "{{ has_comments }}"
        pass_msg: "✓ Comments added to playbook"
        error_msg: "✗ No comments found in webserver.yml - add comments as shown in the module"
