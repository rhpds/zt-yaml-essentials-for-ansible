---
# Module 3 Solve - Adds all three tasks if missing

- name: Module 3 Solve
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  become_user: rhel
  tasks:
    - name: Check for all three tasks
      ansible.builtin.shell: |
        grep -c "Install web server package" /home/rhel/yaml-practice/webserver.yml || echo 0
        grep -c "Start web server" /home/rhel/yaml-practice/webserver.yml || echo 0
        grep -c "Enable web server on boot" /home/rhel/yaml-practice/webserver.yml || echo 0
      register: task_counts
      changed_when: false
      failed_when: false

    - name: Add all three tasks
      ansible.builtin.copy:
        dest: /home/rhel/yaml-practice/webserver.yml
        owner: rhel
        group: rhel
        mode: '0644'
        content: |
          ---
          - name: Configure web server
            hosts: localhost
            become: true

            tasks:
              - name: Install web server package
                ansible.builtin.package:
                  name: httpd

              - name: Start web server
                ansible.builtin.service:
                  name: httpd
                  state: started

              - name: Enable web server on boot
                ansible.builtin.service:
                  name: httpd
                  enabled: yes
      when: "'0' in task_counts.stdout"

    - name: Report success
      ansible.builtin.debug:
        msg: "✓ All three tasks exist - Module 3 complete!"
