---
# Module 4 Solve - Adds copy task with multiple parameters

- name: Module 4 Solve
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  become_user: rhel
  tasks:
    - name: Check if copy task exists
      ansible.builtin.shell: grep -q "Create custom home page" /home/rhel/yaml-practice/webserver.yml
      register: copy_check
      failed_when: false
      changed_when: false

    - name: Add copy task with parameters
      ansible.builtin.copy:
        dest: /home/rhel/yaml-practice/webserver.yml
        owner: rhel
        group: rhel
        mode: '0644'
        content: |
          ---
          - name: Configure web server
            hosts: localhost
            become: true

            tasks:
              - name: Install web server package
                ansible.builtin.package:
                  name: httpd

              - name: Start web server
                ansible.builtin.service:
                  name: httpd
                  state: started

              - name: Enable web server on boot
                ansible.builtin.service:
                  name: httpd
                  enabled: yes

              - name: Create custom home page
                ansible.builtin.copy:
                  dest: /var/www/html/index.html
                  content: "Welcome to my web server!"
                  owner: apache
                  mode: '0644'
      when: copy_check.rc != 0

    - name: Report success
      ansible.builtin.debug:
        msg: "✓ Copy task with parameters exists - Module 4 complete!"
