---
# Module 1 Solve - Ensures webserver.yml exists with minimal playbook

- name: Module 1 Solve
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  become_user: rhel
  tasks:
    - name: Check if webserver.yml exists
      ansible.builtin.stat:
        path: /home/rhel/yaml-practice/webserver.yml
      register: webserver_file

    - name: Create webserver.yml if missing
      ansible.builtin.copy:
        dest: /home/rhel/yaml-practice/webserver.yml
        owner: rhel
        group: rhel
        mode: '0644'
        content: |
          ---
          - name: Configure web server
            hosts: localhost
            become: true
      when: not webserver_file.stat.exists

    - name: Report success
      ansible.builtin.debug:
        msg: "✓ webserver.yml exists - Module 1 complete!"
