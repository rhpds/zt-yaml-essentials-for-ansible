---
- name: Module 1 Setup
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  become_user: rhel
  tasks:
    - name: Ensure workspace exists
      ansible.builtin.file:
        path: /home/rhel/yaml-practice
        state: directory
        owner: rhel
        group: rhel
        mode: '0755'

    - name: Create webserver.yml if it doesn't exist
      ansible.builtin.copy:
        dest: /home/rhel/yaml-practice/webserver.yml
        owner: rhel
        group: rhel
        mode: '0644'
        force: false
        content: |
          ---
          - name: Configure web server
            hosts: localhost
            become: true
