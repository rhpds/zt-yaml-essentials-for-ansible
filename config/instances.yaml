---
# Project Zero instance definitions.
# See https://github.com/rhpds/lab_zero_touch_template for reference.
containers: []
virtualmachines:
  - name: "host1"
    image: "rhel-9.5"
    memory: "4G"
    cores: 2
    image_size: "20G"
    tags:
      - key: "AnsibleGroup"
        value: isolated
    networks:
      - default
      - secondary