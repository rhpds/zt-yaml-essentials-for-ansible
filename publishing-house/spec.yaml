  showroom_type: zero_touch
  intake_type: new
  automation_type: ansible
  description: This lab teaches you the basics of YAML, a simple yet powerful data
    serialization language. It includes practical examples of how YAML is used within
    Ansible. No prior knowledge of YAML or Ansible is required. By the end of this
    lab, you will have a foundation in YAML and an understanding of how it applies
    to Ansible.
  jira_ticket: ''
  workflow_id: 54218878-abdc-4f6c-9c6f-8343fe3b0276
spec:
  title: YAML Essentials for Ansible
  learning_objectives:
  - Create valid YAML files following proper syntax and indentation rules
  - Write YAML dictionaries, lists, and scalars in Ansible playbooks
  - Troubleshoot YAML syntax errors in Ansible configurations
  modules:
  - id: module-01
    title: Why YAML? Introduction and advantages
    duration_min: 8
  - id: module-02
    title: YAML syntax basics - files, indentation, case sensitivity
    duration_min: 12
  - id: module-03
    title: YAML data types - dictionaries, lists, scalars, comments
    duration_min: 12
  - id: module-04
    title: Hands-on practice - write and fix YAML files
    duration_min: 13
