approval_checklist:
  content:
    prerequisites_verifiable: false
    assessment_strategy: ''
    catalog_gap: This lab is differentiated as a focused, standalone introduction
      to YAML fundamentals — teaching different parts of YAML syntax (indentation,
      case sensitivity, dictionaries, lists, scalars, comments) and troubleshooting
      common syntax errors — before learners dive into Ansible automation concepts.
      All existing catalog items teach YAML within the broader context of Ansible
      automation and playbook development, where YAML is learned as a byproduct. This
      lab teaches YAML as the primary subject, using Ansible as context.
