project:
  slug: zt-yaml-essentials-for-ansible
  owner_email: mrudisil@redhat.com
  content_type: lab
  deployment_mode: self_published
  initiative_key: none
  showroom_type: zero_touch
  intake_type: new
  automation_type: ansible
  description: This learning path teaches you the basics of YAML, a simple yet powerful
    data serialization language essential for Red Hat Ansible Automation Platform.
    It includes practical examples of how YAML is used to write Ansible configurations,
    tasks, and Playbooks. No prior knowledge of YAML or Ansible is required. By the
    end of this learning path, you will have a foundation in YAML and an understanding
    of how it applies to Red Hat Ansible Automation Platform automation.
  jira_ticket: ''
  workflow_id: 54218878-abdc-4f6c-9c6f-8343fe3b0276
spec:
  title: YAML Essentials for Ansible
  learning_objectives:
  - Create valid YAML files following proper syntax and indentation rules for Red
    Hat Ansible Automation Platform
  - Write YAML dictionaries, lists, and scalars in Ansible Playbooks
  - Troubleshoot YAML syntax errors in Ansible Automation Platform configurations
    using yamllint
  modules:
  - id: module-01
    title: Why YAML? Introduction and advantages
    duration_min: 8
    status: in_progress
  - id: module-02
    title: YAML syntax basics - files, indentation, case sensitivity
    duration_min: 12
    status: in_progress
  - id: module-03
    title: YAML data types - dictionaries, lists, scalars, comments
    duration_min: 12
    status: in_progress
  - id: module-04
    title: Write and validate YAML with yamllint
    duration_min: 10
    status: in_progress
  - id: module-05
    title: Fix broken YAML using yamllint feedback
    duration_min: 10
    status: not_started
  - id: module-06
    title: Validate and run Ansible playbooks
    duration_min: 10
    status: not_started
