approval_checklist:
  content:
    prerequisites_verifiable: false
    assessment_strategy: Trust-based for Modules 1-3 (reading/understanding). Module
      4 uses visible result verification where learners see immediate feedback when
      YAML is valid or invalid in the VS Code editor, and optionally can run a simple
      playbook to confirm correctness.
    catalog_gap: This lab is differentiated as a focused, standalone introduction
      to YAML fundamentals — teaching different parts of YAML syntax (indentation,
      case sensitivity, dictionaries, lists, scalars, comments) and troubleshooting
      common syntax errors — before learners dive into Ansible automation concepts.
      All existing catalog items teach YAML within the broader context of Ansible
      automation and playbook development, where YAML is learned as a byproduct. This
      lab teaches YAML as the primary subject, using Ansible as context.
    design_overview: This lab teaches YAML fundamentals as a standalone subject for
      learners who need YAML literacy before diving into Ansible automation. Targeting
      beginners with zero prerequisites, it focuses on YAML syntax, structure, data
      types, and troubleshooting common errors using a hands-on VS Code environment
      with Ansible Automation Platform pre-configured.
    module_summaries:
    - title: Why YAML? Introduction and advantages
      overview: Introduces what YAML is, explains why Ansible uses it, and covers
        the advantages YAML offers over other data formats.
    - title: YAML syntax basics - files, indentation, case sensitivity
      overview: Teaches fundamental syntax rules including file structure, indentation
        requirements, and how case sensitivity affects YAML parsing.
    - title: YAML data types - dictionaries, lists, scalars, comments
      overview: Covers core YAML data structures (scalars, lists, dictionaries) and
        comments, showing how to combine them to represent Ansible playbook structures.
    - title: Hands-on practice - write and fix YAML files
      overview: Provides hands-on practice creating valid YAML files from scratch,
        troubleshooting broken YAML examples, and validating work using VS Code feedback.
    rcars_overlap_pct: 67
    rcars_top_matches:
    - title: Writing your first playbook
      ci_name: zt-ansiblebu.zt-ans-bu-writing-playbook.prod
      url: https://catalog.demo.redhat.com/catalog?item=zt-ansiblebu.zt-ans-bu-writing-playbook.prod
      relevance_score: 67
      why_it_fits: This beginner workshop covers YAML playbook syntax and indentation
        rules as foundational content while teaching Ansible automation concepts,
        making it relevant for learners who need to understand YAML in the context
        of Red Hat Ansible Automation Platform. The hands-on progression from inventory
        creation through playbooks naturally exposes learners to YAML dictionaries,
        lists, and scalars in practical use.
    - title: Ansible Workshop - Ansible for Red Hat Enterprise Linux
      ci_name: zt-ansiblebu.zt-ans-bu-rhel.prod
      url: https://catalog.demo.redhat.com/catalog?item=zt-ansiblebu.zt-ans-bu-rhel.prod
      relevance_score: 62
      why_it_fits: This beginner-level workshop covers YAML syntax and Ansible playbook
        fundamentals as core topics, directly addressing the request's goals of writing
        valid YAML files, dictionaries, lists, and scalars within an Ansible Automation
        Platform context. Learners also get exposure to debugging and error handling,
        which maps to the troubleshooting YAML syntax errors requirement.
    - title: Ansible Workshop - Ansible for Red Hat Enterprise Linux (90 mins)
      ci_name: zt-ansiblebu.zt-ans-bu-rhel-90.prod
      url: https://catalog.demo.redhat.com/catalog?item=zt-ansiblebu.zt-ans-bu-rhel-90.prod
      relevance_score: 55
      why_it_fits: This beginner workshop covers YAML syntax and Ansible playbook
        authoring hands-on, giving learners practical exposure to writing YAML structures
        (dictionaries, lists, scalars) in the context of real Ansible tasks. It directly
        addresses the core topics requested while grounding them in a meaningful automation
        use case.
